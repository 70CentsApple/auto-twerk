plugins {
    id 'maven-publish'
    id 'dev.architectury.loom' version '1.14-SNAPSHOT' apply false
    id 'dev.architectury.loom-no-remap' version '1.14-SNAPSHOT' apply false
}

def noRemap = sc.current.parsed.matches('>=26.1')
if (noRemap) {
    apply plugin: 'dev.architectury.loom-no-remap'
} else {
    apply plugin: 'dev.architectury.loom'
}

def mod_brand = (loom.platform.get() as String).toLowerCase()
assert mod_brand in ['fabric', 'neoforge']
assert sc.current.project.endsWith('-' + mod_brand)

repositories {
    maven { url = "https://maven.terraformersmc.com/releases/" }
    maven { url = "https://maven.shedaniel.me/" }
    maven { url = 'https://maven.parchmentmc.org' }
    maven { url = 'https://maven.neoforged.net/releases' }
}

// https://github.com/FabricMC/fabric-loader/issues/783
if (!noRemap) {
    configurations {
        if (mod_brand == 'fabric') {
            modApi {
                exclude group: 'net.fabricmc', module: 'fabric-loader'
            }
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    if (!noRemap) {
        mappings loom.layered() {
            officialMojangMappings()
            if (project.hasProperty('parchment_version') && project.parchment_version.size() > 0) {
                parchment("org.parchmentmc.data:parchment-${project.minecraft_version}:${project.parchment_version}@zip")
            }
        }
    }

    if (mod_brand == 'fabric') {
        if (noRemap) {
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            if (project.findProperty('fabric_api_version')?.toString()?.size() > 0) {
                implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
            }
        } else {
            modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
            if (project.findProperty('fabric_api_version')?.toString()?.size() > 0) {
                modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
            }
        }
    } else if (mod_brand == 'neoforge') {
        neoForge "net.neoforged:neoforge:${project.neoforge_version}"
    }
}

loom {
    runs {
        client {
            ideConfigGenerated = true
            runDir '../../run'
            vmArgs '-Dmixin.debug.export=true'
        }
    }
}

JavaVersion JAVA_COMPATIBILITY =
        sc.current.parsed.matches('>=26.1') ? JavaVersion.VERSION_25 :
                sc.current.parsed.matches('>=1.20.5') ? JavaVersion.VERSION_21 :
                        sc.current.parsed.matches('>=1.18') ? JavaVersion.VERSION_17 :
                                sc.current.parsed.matches('>=1.17') ? JavaVersion.VERSION_16 :
                                        JavaVersion.VERSION_1_8

java {
    sourceCompatibility = JAVA_COMPATIBILITY
    targetCompatibility = JAVA_COMPATIBILITY
}

version = 'v' + project.mod_version + '+' + project.minecraft_version + '-' + mod_brand
group = project.maven_group
base.archivesName = project.archives_base_name

processResources {
    def modProperties = [
            "id"                  : project.mod_id,
            "name"                : project.mod_name,
            "version"             : project.mod_version,
            "minecraft_dependency": project.minecraft_dependency,
    ]
    inputs.properties(modProperties)

    def good_files = [] as Set
    def all_files = [] as Set
    [
            'fabric'  : ['fabric.mod.json'],
            'neoforge': ['META-INF', 'META-INF/neoforge.mods.toml', 'pack.mcmeta'],
    ].forEach { brand, paths ->
        all_files.addAll(paths)
        if (brand == mod_brand) {
            good_files.addAll(paths)
        }
    }
    all_files.forEach { it2 ->
        def path = it2 as String
        if (good_files.contains(path)) {
            filesMatching(path) {
                expand modProperties
            }
        } else {
            exclude path
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${project.archives_base_name}" }
    }
}
