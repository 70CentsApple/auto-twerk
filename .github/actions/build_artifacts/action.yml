name: Build
description: build multi versions (stonecutter buildAndGather)
inputs:
  build_release:
    description: 'value passed as BUILD_RELEASE env to Gradle'
    required: false
    default: 'false'
runs:
  using: composite
  steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 25
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        cache-read-only: false

    - name: Build with gradle
      shell: bash
      run: |
        chmod +x gradlew
        echo "Building..."

        # retry a few times — transient maven failures are not unusual on CI
        MAX_RETRIES=3
        RETRY_DELAY=10

        count=0
        success=false
        while [ $count -lt $MAX_RETRIES ]; do
          if ./gradlew buildAndGather --no-daemon; then
            success=true
            break
          fi
          count=$((count+1))
          echo "⚠️ Build failed. Attempt $count of $MAX_RETRIES..."
          if [ $count -lt $MAX_RETRIES ]; then
            echo "Waiting $RETRY_DELAY seconds before retrying..."
            sleep $RETRY_DELAY
          fi
        done
        if [ "$success" = false ]; then
          echo "❌ Build failed after $MAX_RETRIES attempts."
          exit 1
        fi
      env:
        BUILD_ID: ${{ github.run_number }}
        BUILD_RELEASE: ${{ inputs.build_release }}

    - name: Gather artifacts
      shell: bash
      run: |
        mkdir -p gathered-artifacts
        # buildAndGather drops jars under build/libs/v<mod_version>/
        find build/libs -type f -name '*.jar' -exec mv -t gathered-artifacts {} +

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Artifacts
        path: gathered-artifacts
