name: Release to Modrinth and GitHub

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-github-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: ./.github/actions/build_artifacts/
        with:
          build_release: 'true'

      - name: Generate summary
        uses: ./.github/actions/summary/

      - name: Get variables
        run: |
          raw_file_paths=$(ls ./gathered-artifacts/*)
          # adds line breaks
          file_paths=${raw_file_paths//$'\n'/,}
          echo "file_paths=${file_paths}" >> $GITHUB_ENV

          raw_tag_name=${GITHUB_REF#refs/tags/}
          # removes the 'v' prefix
          tag_name=${raw_tag_name#v}
          echo "tag_name=${tag_name}" >> $GITHUB_ENV

          # CHANGELOG.md is optional — fall back to auto-generated notes if absent
          if [ -f CHANGELOG.md ]; then
            echo "Using CHANGELOG.md as release body"
            echo "has_changelog=true" >> $GITHUB_ENV
            changelog=$(cat CHANGELOG.md)
            echo "changelog<<EOF" >> $GITHUB_ENV
            echo "${changelog}" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "No CHANGELOG.md — relying on auto-generated release notes"
            echo "has_changelog=false" >> $GITHUB_ENV
            echo "changelog=" >> $GITHUB_ENV
          fi

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: 70CentsApple/auto-twerk
          tag_name: "v${{ env.tag_name }}"
          name: "v${{ env.tag_name }}"
          body: ${{ env.changelog }}
          draft: false
          prerelease: false
          # append auto-generated notes; when CHANGELOG.md is missing, body is empty
          # and the auto-generated notes become the entire body
          generate_release_notes: true
          files: ${{ env.file_paths }}

      - name: Fetch Release Notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching release notes from GitHub..."
          gh release view "v${{ env.tag_name }}" --repo ${{ github.repository }} --json body --jq '.body' > release_notes.md

      - name: Upload Release Notes
        uses: actions/upload-artifact@v4
        with:
          name: Release Notes
          path: release_notes.md

  modrinth-release:
    needs:
      - build-and-github-release
    runs-on: ubuntu-latest
    strategy:
      # ensure uploads happen sequentially — Modrinth dislikes parallel writes for the same project
      max-parallel: 1
      matrix:
        include:
          # --- 26.x ---
          - artifact: "26.2-fabric"
            target_game_versions: "26.2"
            formatted_version_name: "26.2"
            modloader: "fabric"

          - artifact: "26.2-neoforge"
            target_game_versions: "26.2"
            formatted_version_name: "26.2"
            modloader: "neoforge"

          - artifact: "26.1.2-fabric"
            target_game_versions: "26.1,26.1.1,26.1.2"
            formatted_version_name: "26.1(.x)"
            modloader: "fabric"

          - artifact: "26.1.2-neoforge"
            target_game_versions: "26.1,26.1.1,26.1.2"
            formatted_version_name: "26.1(.x)"
            modloader: "neoforge"

          # --- 1.21.x ---
          - artifact: "1.21.11-fabric"
            target_game_versions: "1.21.9,1.21.10,1.21.11"
            formatted_version_name: "1.21.9(.10,11)"
            modloader: "fabric"

          - artifact: "1.21.11-neoforge"
            target_game_versions: "1.21.9,1.21.10,1.21.11"
            formatted_version_name: "1.21.9(.10,11)"
            modloader: "neoforge"

          - artifact: "1.21.1-fabric"
            target_game_versions: "1.21,1.21.1,1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8"
            formatted_version_name: "1.21(.1,2,3,4,5,6,7,8)"
            modloader: "fabric"

          - artifact: "1.21.1-neoforge"
            target_game_versions: "1.21,1.21.1,1.21.2,1.21.3,1.21.4,1.21.5,1.21.6,1.21.7,1.21.8"
            formatted_version_name: "1.21(.1,2,3,4,5,6,7,8)"
            modloader: "neoforge"

          # --- 1.20.x ---
          - artifact: "1.20.1-fabric"
            target_game_versions: "1.20,1.20.1,1.20.2,1.20.3,1.20.4,1.20.5,1.20.6"
            formatted_version_name: "1.20.x"
            modloader: "fabric"

          # --- 1.19.x, 1.18.x, 1.17.x, 1.16.x ---
          - artifact: "1.19.4-fabric"
            target_game_versions: "1.19,1.19.1,1.19.2,1.19.3,1.19.4"
            formatted_version_name: "1.19.x"
            modloader: "fabric"

          - artifact: "1.18.2-fabric"
            target_game_versions: "1.18,1.18.1,1.18.2"
            formatted_version_name: "1.18.x"
            modloader: "fabric"

          - artifact: "1.17.1-fabric"
            target_game_versions: "1.17,1.17.1"
            formatted_version_name: "1.17.x"
            modloader: "fabric"

          - artifact: "1.16.5-fabric"
            target_game_versions: "1.16,1.16.1,1.16.2,1.16.3,1.16.4,1.16.5"
            formatted_version_name: "1.16.x"
            modloader: "fabric"

    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts (JARs)
        uses: actions/download-artifact@v4
        with:
          name: Artifacts
          path: gathered-artifacts

      - name: Download Release Notes
        uses: actions/download-artifact@v4
        with:
          name: Release Notes
          path: gathered-artifacts

      - name: Resolve file path and changelog
        run: |
          file_path=$(ls gathered-artifacts/*${{ matrix.artifact }}*.jar)
          echo "file_path=${file_path}" >> $GITHUB_ENV
          echo "file_path for this version is: $file_path"

          raw_tag_name=${GITHUB_REF#refs/tags/}
          tag_name=${raw_tag_name#v}
          echo "tag_name=${tag_name}" >> $GITHUB_ENV

          # release_notes.md was fetched from the GitHub release, which already
          # merges CHANGELOG.md (if any) with auto-generated notes
          changelog=$(cat gathered-artifacts/release_notes.md)
          echo "changelog<<EOF" >> $GITHUB_ENV
          echo "${changelog}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      # https://github.com/marketplace/actions/upload-to-modrinth
      - name: Upload to Modrinth
        uses: RubixDev/modrinth-upload@v1
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          file_path: ${{ env.file_path }}
          name: "v${{ env.tag_name }}+${{ matrix.formatted_version_name }}+${{ matrix.modloader }}"
          version: "${{ env.tag_name }}+${{ matrix.formatted_version_name }}-${{ matrix.modloader }}"
          changelog: ${{ env.changelog }}
          game_versions: ${{ matrix.target_game_versions }}
          release_type: "release"
          loaders: "${{ matrix.modloader }}"
          featured: false
          project_id: "SsUJxcog"
